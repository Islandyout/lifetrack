name: Build LifeTrack APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets to Android
        run: npx cap sync android

      - name: Make Gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            echo "APK built successfully: $(du -sh $APK_PATH)"
          else
            echo "APK not found! Listing build outputs:"
            find android/app/build/outputs -name "*.apk" 2>/dev/null || echo "No APKs found"
            exit 1
          fi

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: LifeTrack-APK-build${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LifeTrack Build ${{ github.run_number }}
          body: |
            ## LifeTrack APK

            **Download:** `app-debug.apk` below

            ### Install on Android:
            1. Download the APK
            2. Open it on your phone
            3. If blocked: Settings → Security → Install unknown apps → Allow
            4. Tap Install → Open
            5. Grant notification & alarm permissions when prompted

            ### What's included:
            - Background alarms & notifications (even when app is closed)
            - Full LifeTrack app with Budget, Tasks, Health, Schedule & Reminders
          files: android/app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
