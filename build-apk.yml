name: Build LifeTrack APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor CLI globally
        run: npm install -g @capacitor/cli @capacitor/android@latest @capacitor/core@latest

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android || true
          fi

      - name: Sync Capacitor
        run: npx cap sync android || true

      - name: Make Gradlew executable
        run: chmod +x android/gradlew 2>/dev/null || true

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon 2>&1

      - name: Check if APK exists
        run: |
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK built successfully"
            ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          else
            echo "APK not found - checking gradle output"
            find android -name "*.apk" -type f
          fi

      - name: Get version
        id: version
        run: echo "version=1.1.0" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LifeTrack-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-build${{ github.run_number }}
          name: LifeTrack v1.1.0 (Build ${{ github.run_number }})
          body: |
            Download app-debug.apk below.
            
            Install on Android:
            1. Download the APK
            2. Open on your phone
            3. If blocked, go to Settings → Security → Unknown sources → Allow
            4. Install
          files: android/app/build/outputs/apk/debug/app-debug.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
